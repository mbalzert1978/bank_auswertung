[dependencies]
# Seit dem Kernel-Flip (ADR-0011) spezifiziert die Blackbox auf **Handler-Ebene** über den
# `application_kernel`-Vertrag der TestApi und assertiert gegen den **nackten Domänen-`ReadError`**
# (vom Adapter re-exportiert) — keine `shared_kernel`-Outbox-Typen mehr. Der Spec hängt damit
# nur noch am eigenen Adapter.
einlesen_adapter = { path = "../einlesen_adapter" }
