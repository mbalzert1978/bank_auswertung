[package]
name = "obfuskierung_adapter"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
obfuskierung_domain = { path = "../obfuskierung_domain" }
shared_kernel = { path = "../shared_kernel" }

[dev-dependencies]
# Nur für den compilergeprüften „kein Serialize"-Guard auf `ObfuscatedBooking` (das Egress-DTO
# leitet bewusst kein `Serialize`/`Deserialize` ab) — kein Laufzeit-serde im Slice.
serde = "1"
static_assertions = "1.1.0"
