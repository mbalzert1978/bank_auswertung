[package]
name = "auswerten_adapter"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
auswerten_domain = { path = "../auswerten_domain" }
application_kernel = { path = "../application_kernel" }

[dev-dependencies]
# Nur für den compilergeprüften „kein Serialize"-Guard auf den Egress-DTOs (`CategoryRequestRow`,
# `HistoryEvaluationRow` samt Teilen — sie leiten bewusst kein `Serialize`/`Deserialize` ab) —
# kein Laufzeit-serde im Slice.
serde = "1"
static_assertions = "1.1.0"
