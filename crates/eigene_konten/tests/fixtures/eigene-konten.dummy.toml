# DUMMY-Config — rein fiktive Platzhalter, KEINE echten Konten.
# BLZ 12345678 und die fortlaufenden Kontonummern sind offensichtlich erfunden;
# nur die IBAN-Prüfsummen sind gültig, damit der Loader sie akzeptiert.
# Ersetzt vorläufig Markus' echte Eigene-Konten-Config — der HITL-Teil von
# Issue 0002 (echte IBANs + Rollen) bleibt bewusst offen.

[[konto]]
iban  = "DE20 1234 5678 0000 0011 11"
rolle = "Giro"

[[konto]]
iban  = "DE93 1234 5678 0000 0022 22"
rolle = "Haushalt"

[[konto]]
iban  = "DE69 1234 5678 0000 0033 33"
rolle = "Spar"

[[konto]]
iban  = "DE45 1234 5678 0000 0044 44"
rolle = "Vorlauf"
