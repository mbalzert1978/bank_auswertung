# personen.example.toml — VORLAGE, nicht die echte Liste.
#
# So benutzt du sie:
#   1. Kopiere diese Datei nach `personen.toml` (im Repo-Wurzelverzeichnis).
#   2. Trage dort die Namen ein, unter denen Personen im Verwendungszweck
#      auftauchen können — auch Vornamen und Kurzformen, unter denen
#      Empfänger im Verwendungszweck auftauchen (z. B. „Taschengeld Lisa"
#      für die Empfängerin „Lisa Beispiel").
#   3. `personen.toml` ist per .gitignore ausgeschlossen und verlässt die
#      Maschine nie — nur diese Vorlage mit erfundenen Namen wird versioniert.
#   4. Beim Lauf mit `--personen personen.toml` übergeben. Die Option ist Pflicht;
#      gibt es keine weiteren Namen, steht hier `namen = []`.
#
# Wozu: Bevor ein Freitext (Verwendungszweck) als `ObfuskierterText` weiterläuft,
# werden darin Personen-Namen ersetzt. Den **vollständigen** Namen jedes
# Empfängers einer Buchung ohne Gläubiger-ID kennt das Programm selbst aus der
# Datenbank. Teilnamen davon (nur der Vorname, mit Titel, ein Teil eines
# Doppelnamens) schwärzt es **nicht** von selbst — einzelne Wörter träfen zu
# viel gewöhnlichen Text. Solche Teilnamen gehören hierher, ebenso Namen, die
# nie Empfänger waren.
#
# Für den Chat-Export (`--kategorien-export`, Issue 0011) besonders wichtig: der
# **eigene** Name, Vornamen, PayPal-Freunde (sie stehen im Verwendungszweck
# einer PayPal-Zahlung, der hinausgeht) und Personen mit eigener Gläubiger-ID
# (privater Vermieter, Verein) — deren Name gälte sonst als Firmenname.
#
# Wann eintragen: VOR dem ersten Lauf — und zwar die bekannten Empfänger-Namen
# aller Konten samt ihrer Vornamen und Kurzformen. Ein Name, der erst mit einem
# späteren Import bekannt wird, wirkt nicht rückwirkend auf schon obfuskierte
# Buchungen.
#
# Ehrliche Grenze: das Ersetzen ist heuristisch und nicht beweisbar vollständig.
# Ein Name, der weder vollständig Empfänger war noch hier steht, wird nicht
# erkannt.
#
# Ein Eintrag je Name, so wie er im Text steht. Groß-/Kleinschreibung spielt
# keine Rolle. Die Namen unten sind erfunden.

namen = [
    "Erika Mustermann",
    "Max Mustermann",
    "Erika",
]
